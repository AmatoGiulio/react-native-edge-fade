buildscript {
  ext.EdgeFade = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return EdgeFade[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

// Default remains dependency-free. The official alpha is a separate,
// opt-in reference requiring the consumer's compatible SDK/AGP/Kotlin setup.
def withAndroidxBlur = (findProperty("edgeFadeAndroidxBlur") ?: "false").toString().toBoolean()

android {
  namespace "com.edgefade"

  if (withAndroidxBlur) {
    // Compose alpha03 release notes specify SDK 37.1 for consumers as well.
    // Keep default consumers untouched; the example helper aligns root/app/modules.
    compileSdk {
      version = release(37) { it.minorApiLevel = 1 }
    }
  } else {
    compileSdkVersion getExtOrDefault("compileSdkVersion")
  }

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  sourceSets {
    main.java.srcDir(withAndroidxBlur ? "src/androidxBlur/java" : "src/noAndroidxBlur/java")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.core:core-ktx:1.13.1"
  if (withAndroidxBlur) {
    implementation "androidx.compose.ui:ui-graphics:1.13.0-alpha03"
  }
}
