buildscript {
  ext.EdgeFade = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return EdgeFade[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.').take(2).collect { it as int }
def builtInKotlin = agpVersion[0] >= 9 && (findProperty("android.builtInKotlin") ?: "true").toBoolean()
if (!builtInKotlin) {
  apply plugin: "kotlin-android"
}
apply plugin: "com.facebook.react"

// Opt in only in consumers with a compatible toolchain. The default keeps the
// dependency-free renderer and the existing SDK requirements.
def useAndroidxBlur = (findProperty("edgeFadeAndroidxBlur") ?: "false").toBoolean()
if (useAndroidxBlur && (agpVersion[0] < 9 || (agpVersion[0] == 9 && agpVersion[1] < 1))) {
  throw new GradleException("edgeFadeAndroidxBlur requires AGP 9.1+ and compileSdk 37.1 in the app. Leave it disabled on older toolchains.")
}

android {
  namespace "com.edgefade"
  compileSdkVersion getExtOrDefault("compileSdkVersion")
  if (useAndroidxBlur) {
    compileSdk = 37
    compileSdkMinor = 1
  }

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    // AGP 9 removed targetSdk from the library DSL; the app owns this value.
    if (agpVersion[0] < 9) {
      targetSdkVersion getExtOrDefault("targetSdkVersion")
    }
  }

  sourceSets {
    main.java.srcDir(useAndroidxBlur ? "src/androidxBlur/java" : "src/noAndroidxBlur/java")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.core:core-ktx:1.13.1"
  if (useAndroidxBlur) {
    implementation "androidx.compose.ui:ui-graphics:1.13.0-alpha03"
  }
}
