plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cratecanvas'
version = '0.1.0'

android {
  namespace "expo.modules.cratecanvas"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
  // The selection drives the enclosing EdgeFadeView directly (same frame,
  // same spring) instead of round-tripping animated props through React.
  compileOnly project(':react-native-edge-fade')
}
